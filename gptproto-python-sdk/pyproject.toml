[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gptproto"
version = "0.1.0"
description = "Spec-driven SDK for the gptproto async media generation API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "gptproto"}]
keywords = ["gptproto", "sdk", "ai", "video-generation", "image-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24",
    "attrs>=22.2",
    "python-dateutil>=2.8",
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://gptproto.com"
Repository = "https://github.com/gptproto/gptproto-sdk"

[tool.setuptools.packages.find]
include = ["gptproto*"]
